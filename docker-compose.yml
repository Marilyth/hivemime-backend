volumes:
  postgres-data:

services:
  postgres:
    image: postgres:18
    container_name: hivemime-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hivemime
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

  backend:
    image: marilyth/hivemime-backend:latest
    container_name: hivemime-backend
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: ${DB_CONNECTION}
      Jwt__Key: ${JWT_KEY}