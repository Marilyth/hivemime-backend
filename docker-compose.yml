volumes:
  postgres-data:

services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: hivemime-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hivemime
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped


  grafana-lgtm:
    image: grafana/otel-lgtm:0.28.0
    container_name: hivemime-grafana-lgtm
    restart: unless-stopped
    ports:
      - "3001:3000"  # Grafana UI
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP

  backend:
    image: marilyth/hivemime-backend:latest
    container_name: hivemime-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: ${ConnectionStrings__Default}
      Observability__Endpoint: ${Observability__Endpoint}
      R2__AccessKey: ${R2__AccessKey}
      R2__SecretKey: ${R2__SecretKey}
      R2__S3API: ${R2__S3API}
      R2__BucketName: ${R2__BucketName}