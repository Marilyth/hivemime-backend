volumes:
  postgres-data:

services:
  postgres:
    image: postgres:18
    container_name: hivemime-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hivemime
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13
    container_name: hivemime-aspire-dashboard
    restart: unless-stopped
    ports:
      - "18888:18888"
      - "4317:18889"
      - "4318:18890"

  backend:
    image: marilyth/hivemime-backend:latest
    container_name: hivemime-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: ${ConnectionStrings__Default}
      R2__AccessKey: ${R2__AccessKey}
      R2__SecretKey: ${R2__SecretKey}
      R2__S3API: ${R2__S3API}
      R2__BucketName: ${R2__BucketName}